# =============================================================================
# MealStack Selenium Test Configuration
# =============================================================================
# Centralising configuration here follows the DRY principle.
# Any change (e.g. a new base URL) only needs to be made in ONE place.
# Interview Tip: "I externalised test configuration so the same test code can
# run against different environments (local, staging, prod) without code changes."

# ── Application URLs ──────────────────────────────────────────────────────────
base.url=http://localhost:5173
login.url=http://localhost:5173/login
register.url=http://localhost:5173/register
home.url=http://localhost:5173/home
cart.url=http://localhost:5173/cart
admin.url=http://localhost:5173/admin

# ── Browser Configuration ─────────────────────────────────────────────────────
# Supported values: chrome, firefox, edge
browser=chrome
# Run tests without opening a browser window (useful for CI/CD pipelines)
headless=false
# Browser window dimensions
window.width=1920
window.height=1080

# ── Timeout Settings (in seconds) ─────────────────────────────────────────────
# implicit.wait: Maximum time WebDriver polls DOM for an element before throwing NoSuchElementException
implicit.wait=10
# explicit.wait: Maximum time WebDriverWait waits for an ExpectedCondition to be true
explicit.wait=20
# page.load.timeout: Maximum time to wait for a page to fully load
page.load.timeout=30
# script.timeout: Maximum time for async JavaScript execution
script.timeout=15

# ── Test User Credentials ─────────────────────────────────────────────────────
# Valid regular user (pre-created in the test environment)
user.email=testuser@mealstack.com
user.password=Test@1234
user.name=Test User

# Admin credentials
admin.email=admin@mealstack.com
admin.password=Admin@1234

# ── Test Data ─────────────────────────────────────────────────────────────────
# Used in registration tests
new.user.email=newuser_{{timestamp}}@mealstack.com
new.user.password=NewUser@1234
new.user.name=New Test User

# Invalid credentials (for negative tests)
invalid.email=invalid@notexist.com
invalid.password=WrongPass@999

# ── Screenshot Configuration ──────────────────────────────────────────────────
# Directory where failure screenshots are saved
screenshot.dir=test-output/screenshots
# Screenshot format
screenshot.format=PNG

# ── Report Configuration ──────────────────────────────────────────────────────
report.dir=test-output/extent-reports
report.name=MealStack_TestReport
